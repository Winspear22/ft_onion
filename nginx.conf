# Tourne en tant que processus principal (pas en daemon) pour Docker
daemon off;

# Utilisateur qui fait tourner Nginx
user www-data;

# Nombre de processus workers
worker_processes auto;

# Fichier de log pour les erreurs
error_log /var/log/nginx/error.log;

# Fichier contenant le PID du process principal
pid /run/nginx.pid;

events {
    # Nombre max de connexions simultanées par worker
    worker_connections 128;
}

http {
    # IMPORTANTE : Inclure les types MIME pour que le navigateur comprenne style.css !
    include /etc/nginx/mime.types;

    # Log des accès HTTP
    access_log /var/log/nginx/access.log;

    server {
        # Écouter sur le port 80 (HTTP)
        listen 80;

        # Nom du serveur (localhost car on passe par Tor)
        server_name localhost;

        # Dossier racine où on va mettre tes fichiers index.html et style.css
        root /var/www/html;

        # Fichier par défaut
        index index.html;

        # Route par défaut
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
